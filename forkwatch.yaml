services:
  forkwatch:
    image: aervorn/forkwatch:2     # to build from source instead: replace this line with "build: ."
    container_name: ForkWatch
    restart: unless-stopped
    ports:
      - "9999:8080"          # dashboard: http://<YOUR_IP>:9999
    environment:
      TZ: Europe/Paris
    volumes:
      - /<YOUR>/<PATH>/forkwatch/data:/data      # settings, secrets, repository list, Git mirrors, .bundle archives, log
