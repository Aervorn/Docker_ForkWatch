# Builds the multi-architecture image and pushes it to Docker Hub.
# Runs when a GitHub release is published, or by hand from the Actions tab.
# Needs one repository secret: DOCKERHUB_TOKEN (a Docker Hub access token with Read & Write).
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 2.2.0"
        required: true

env:
  IMAGE: aervorn/forkwatch

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tags
        id: v
        env:
          RAW: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          version="${RAW#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version: $RAW" >&2
            exit 1
          fi
          if ! grep -q "^VERSION = \"$version\"$" app/forkwatch.py; then
            echo "app/forkwatch.py is not at version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: aervorn
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.major }}
            ${{ env.IMAGE }}:latest
